id = "looperecho/mic-status"
name = "Mic Status"
version = "0.3.0"
plugin_api = 9
author = "looperecho"
license = "MIT"

dependencies = ["pactl", "cava", "wpctl"]
tags = ["audio", "privacy", "bar"]
icon = "microphone-filled"

description = "Combined microphone capture, mute, and voice activity indicator."

[[widget]]
id = "mic-status"
entry = "mic-status.luau"

[[setting]]
key = "capture_color"
type = "color"
label_key = "settings.capture_color.label"
description_key = "settings.capture_color.description"
default = "#D7AF87"

[[setting]]
key = "muted_color"
type = "color"
label_key = "settings.muted_color.label"
description_key = "settings.muted_color.description"
default = "tertiary"

[[setting]]
key = "activity_color"
type = "color"
label_key = "settings.activity_color.label"
description_key = "settings.activity_color.description"
default = "#8DB881"

[[setting]]
key = "app_blacklist"
type = "string_list"
label_key = "settings.app_blacklist.label"
description_key = "settings.app_blacklist.description"
default = ["Noctalia Spectrum"]
